# Consulta diaria de la fuente oficial. Sólo publica datos validados.
# Autorizado por Francisco el 12/11/2026: diario a las 07:17 de Argentina (10:17 UTC).
name: tariff-update
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tariff-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultar y validar ARCA
        run: node scripts/update-tariff-base.mjs
      - name: Comprobar aplicación
        run: npm run build
      - name: Publicar únicamente la base validada
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/data/(ncm8|ncmDescriptions|tariffMeta)\.js|data/tariff-base\.json|data/tariff-history/CHANGELOG\.md)$'
          unexpected=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then echo "Cambios fuera de la base: actualización detenida"; exit 1; fi
          git add -- src/data/ncm8.js src/data/ncmDescriptions.js src/data/tariffMeta.js data/tariff-base.json data/tariff-history/CHANGELOG.md
          if git diff --cached --quiet; then echo "Sin cambios de fuente"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualizar base oficial ARCA validada'
          git push origin HEAD:main
